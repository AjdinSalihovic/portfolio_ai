<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .logo {
      width: 120px;
      height: 120px;
      background: #092140;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 30px;
    }
    .logo-text {
      color: white;
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 2px;
    }
    .name {
      font-size: 52px;
      font-weight: 700;
      color: #092140;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 28px;
      font-weight: 400;
      color: #52627A;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-text">AY</span>
  </div>
  <div class="name">Ajdin Salihović</div>
  <div class="subtitle">Portfolio</div>
</body>
</html>
